name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy app tests
      - name: Test
        run: uv run pytest --cov --cov-report=term-missing

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: edupulse
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: edupulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edupulse" --health-interval 5s --health-timeout 3s
          --health-retries 20
    env:
      EDUPULSE_DATABASE_URL: postgresql+psycopg://edupulse:ci-only-password@127.0.0.1:5432/edupulse
      EDUPULSE_DEMO_PASSWORD: Ci-Demo-Password-1
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Migrate (upgrade, drift check, downgrade, upgrade)
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Seed synthetic data
        run: uv run python -m app.seed

  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy edupulse_ml tests
      - run: uv run pytest --cov
      - name: Reproduce the published model run (downloads the UCI data, verifies SHA-256)
        run: uv run python -m edupulse_ml.reproduce

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: edupulse
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: edupulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edupulse" --health-interval 5s --health-timeout 3s
          --health-retries 20
    env:
      EDUPULSE_DATABASE_URL: postgresql+psycopg://edupulse:ci-only-password@127.0.0.1:5432/edupulse
      EDUPULSE_JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-0123456789
      EDUPULSE_DEMO_PASSWORD: Ci-Demo-Password-1
      EDUPULSE_CORS_ORIGINS: http://127.0.0.1:4173
      E2E_PASSWORD: Ci-Demo-Password-1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start API with synthetic data
        working-directory: backend
        run: |
          uv sync --frozen --no-dev
          uv run --no-dev alembic upgrade head
          uv run --no-dev python -m app.seed
          nohup uv run --no-dev uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/v1/health && break; sleep 1; done
      - name: Build web app
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Playwright (375 px and 1440 px)
        working-directory: frontend
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            api.log

name: edupulse

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edupulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-edupulse}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${EDUPULSE_DB_PORT:-5432}:5432"

  api:
    build: ./backend
    environment:
      EDUPULSE_ENVIRONMENT: ${EDUPULSE_ENVIRONMENT:-development}
      EDUPULSE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-edupulse}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-edupulse}
      EDUPULSE_JWT_SECRET: ${EDUPULSE_JWT_SECRET:?set EDUPULSE_JWT_SECRET in .env}
      EDUPULSE_CORS_ORIGINS: ${EDUPULSE_CORS_ORIGINS:-http://localhost:8088}
      EDUPULSE_DEMO_PASSWORD: ${EDUPULSE_DEMO_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - "127.0.0.1:${EDUPULSE_API_PORT:-8000}:8000"

  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${EDUPULSE_WEB_PORT:-8088}:8080"

volumes:
  db-data:

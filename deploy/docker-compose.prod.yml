# Production / public-demo deployment. Caddy is the only service with published ports (80/443,
# automatic HTTPS for EDUPULSE_DOMAIN). The database and the API are reachable only on the
# internal network. See deploy/README.md.
#
#   cd deploy && docker compose -f docker-compose.prod.yml up -d --build
name: edupulse-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-api-env: &api-env
  EDUPULSE_ENVIRONMENT: production
  EDUPULSE_DATABASE_URL: postgresql+psycopg://edupulse:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/edupulse
  EDUPULSE_JWT_SECRET: ${EDUPULSE_JWT_SECRET:?set EDUPULSE_JWT_SECRET}
  EDUPULSE_CORS_ORIGINS: https://${EDUPULSE_DOMAIN:?set EDUPULSE_DOMAIN}
  EDUPULSE_HSTS: "true"
  EDUPULSE_DEMO_MODE: ${EDUPULSE_DEMO_MODE:-true}
  EDUPULSE_DEMO_PASSWORD: ${EDUPULSE_DEMO_PASSWORD:-}
  EDUPULSE_PUBLIC_DEMO: ${EDUPULSE_PUBLIC_DEMO:-false}
  EDUPULSE_DEMO_RESET_HOURS: ${EDUPULSE_DEMO_RESET_HOURS:-6}
  # Uvicorn trusts X-Forwarded-For only from Caddy (fixed address below).
  EDUPULSE_TRUSTED_PROXY: 172.31.58.10

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: edupulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: edupulse
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edupulse -d edupulse"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
    logging: *logging
    # No ports: the database is never published.

  api:
    build: ../backend
    restart: unless-stopped
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768M }
    logging: *logging
    # No ports: only Caddy reaches the API.

  web:
    build: ../frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }
    logging: *logging

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      EDUPULSE_DOMAIN: ${EDUPULSE_DOMAIN:?set EDUPULSE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL (for Let's Encrypt expiry notices)}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api
    networks:
      default:
        ipv4_address: 172.31.58.10
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }
    logging: *logging

  # Public demo only: seeds an empty database, then resets it every EDUPULSE_DEMO_RESET_HOURS
  # (removing sign-ups, audit entries and sessions). Exits at once when EDUPULSE_PUBLIC_DEMO
  # is not true.
  demo-reset:
    build: ../backend
    restart: on-failure
    command: ["python", "-m", "app.demo_reset", "--loop"]
    environment: *api-env
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
    logging: *logging

  # Daily compressed pg_dump into the db-backups volume; keeps BACKUP_KEEP_DAYS days.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: edupulse
      PGDATABASE: edupulse
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - db-backups:/backups
      - ./backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["sh", "/usr/local/bin/backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }
    logging: *logging

networks:
  default:
    ipam:
      config:
        # Fixed subnet so Caddy has a known address; other containers get addresses from
        # ip_range only, which never includes Caddy's.
        - subnet: 172.31.58.0/24
          ip_range: 172.31.58.128/25

volumes:
  db-data:
  db-backups:
  caddy-data:
  caddy-config:
